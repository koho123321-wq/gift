<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Видео для тебя</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
}
html, body {
width: 100%;
height: 100%;
background-color: #000000;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.player-wrapper {
position: relative;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
padding: 8px;
}
video {
width: 100%;
height: 100%;
max-width: 100vw;
max-height: 100vh;
object-fit: contain;
background-color: #000000;
outline: none;
border-radius: 8px;
}
</style>
</head>
<body>
<div class="player-wrapper">
<!-- 
playsinline & webkit-playsinline: обязательны для iOS, чтобы ролик запускался прямо на странице
controls: чистый системный плеер (пауза, таймлайн, звук, полноэкранный режим)
preload="metadata": быстрая инициализация первого кадра без лишнего расхода трафика
-->
<video 
controls 
autoplay 
playsinline 
webkit-playsinline 
preload="metadata">
<source src="video.mp4" type="video/mp4">
Ваш браузер не поддерживает видео.
</video>
</div>
</body>
</html>
